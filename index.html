<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIU University</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #062b55;
            color: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            font-size: 26px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
            font-weight: bold;
        }

        .hero {
            min-height: 430px;
            background: linear-gradient(
                rgba(0, 25, 60, .65),
                rgba(0, 25, 60, .65)
            ),
            url("https://images.unsplash.com/photo-1562774053-701939374585?w=1400")
            center/cover no-repeat;
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .hero h2 {
            font-size: 44px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 19px;
            margin-bottom: 28px;
        }

        .button {
            display: inline-block;
            background: #ffc107;
            color: #062b55;
            padding: 13px 24px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        section {
            padding: 55px 8%;
            text-align: center;
        }

        section h2 {
            color: #062b55;
            font-size: 30px;
            margin-bottom: 22px;
        }

        .about p {
            max-width: 800px;
            margin: auto;
            line-height: 1.8;
            font-size: 17px;
        }

        .courses {
            background: white;
        }

        .course-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .card {
            background: #f4f7fb;
            padding: 30px 20px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000012;
        }

        .card h3 {
            color: #062b55;
            margin-bottom: 15px;
        }

        .card p {
            line-height: 1.7;
        }

        .contact {
            background: #e8eef6;
        }

        .contact p {
            margin: 12px;
        }

        footer {
            background: #062b55;
            color: white;
            text-align: center;
            padding: 22px;
        }

        @media (max-width: 600px) {
            header {
                justify-content: center;
                text-align: center;
            }

            .hero h2 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>SIU UNIVERSITY 🎓</h1>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#courses">Courses</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<div class="hero" id="home">
    <div>
        <h2>Welcome to SIU University</h2>
        <p>Education Today, Leadership Tomorrow.</p>
        <a href="#courses" class="button">Explore Courses</a>
    </div>
</div>

<section class="about" id="about">
    <h2>About Our University</h2>

    <p>
        SIU University is dedicated…
